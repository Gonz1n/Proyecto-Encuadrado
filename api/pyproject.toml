[project]
name = "encuadrado-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
