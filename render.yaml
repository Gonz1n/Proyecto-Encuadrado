services:
  - type: web
    name: encuadrado-api
    runtime: python
    rootDir: api
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run alembic upgrade head && uv run python -m app.db.seed && uv run fastapi run app/main.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        sync: false
